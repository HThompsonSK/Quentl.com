<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Quentl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <script src="theme.js"></script>
</head>
<body class="p-10 font-sans min-h-screen" data-nav="products">
    <div class="max-w-6xl mx-auto">
        <header class="site-header">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="/app/" class="site-brand-logoLink" aria-label="Quentl home">
                        <span class="site-logo-text">Quentl</span>
                    </a>
                </div>
            </div>
            <div class="site-header-actions">
            <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color scheme" title="Light / dark mode">
                <span class="theme-toggle__thumb" aria-hidden="true"></span>
            </button>
            </div>
        </header>
        <script src="site-nav.js"></script>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Products</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Catalog SKUs, pricing, and unit economics for forecasts and analytics.</p>
        </div>

        <div class="surface-card p-6 border-t-2 border-t-[var(--accent-orange)]">
            <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Add product</h3>
            <p class="text-sm text-[var(--text-muted)] mb-6 border-b border-[var(--border-subtle)] pb-4">Same data as before — now lives here instead of Settings.</p>
            <form id="productForm" class="space-y-6">
                <input type="hidden" name="company_id" value="1">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Product name</label>
                        <input type="text" name="name" placeholder="e.g. Apricot Jam" class="w-full font-mono" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">SKU</label>
                        <input type="text" name="sku" placeholder="e.g. JAM-002" class="w-full font-mono" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Sales price (£)</label>
                        <input type="number" step="0.01" name="price" placeholder="4.00" class="w-full font-mono" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Cost of goods (£)</label>
                        <input type="number" step="0.01" name="cogs" placeholder="1.20" class="w-full font-mono" required>
                    </div>
                </div>

                <button type="submit" class="btn-accent w-full">Save product</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('Product saved.');
                    e.target.reset();
                } else {
                    alert('Could not save product.');
                }
            } catch (err) {
                console.error(err);
                alert('Error connecting to server.');
            }
        });
    </script>
</body>
</html>
