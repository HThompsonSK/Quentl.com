<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Jam Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">

    <div class="max-w-2xl mx-auto">
        <nav class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">⚙️ Settings</h1>
            <div class="space-x-4">
                <a href="index.html" class="text-blue-600 hover:text-blue-800 font-medium">← Back to Dashboard</a>
            </div>
        </nav>

        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">🍓 Add New Product</h2>
            <form id="productForm" class="space-y-4">
                <input type="hidden" name="company_id" value="1">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Product Name</label>
                        <input type="text" name="name" placeholder="e.g. Apricot Jam" class="mt-1 w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">SKU</label>
                        <input type="text" name="sku" placeholder="e.g. JAM-002" class="mt-1 w-full p-2 border rounded" required>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Sales Price (£)</label>
                        <input type="number" step="0.01" name="price" placeholder="4.00" class="mt-1 w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Cost of Goods (£)</label>
                        <input type="number" step="0.01" name="cogs" placeholder="1.20" class="mt-1 w-full p-2 border rounded" required>
                    </div>
                </div>

                <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded hover:bg-pink-700 font-bold">
                    + Add Product
                </button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold text-gray-700 mb-4 border-b pb-2">💸 Add Fixed Expense</h2>
            <form id="expenseForm" class="space-y-4">
                <input type="hidden" name="company_id" value="1">

                <div>
                    <label class="block text-sm font-medium text-gray-700">Expense Name</label>
                    <input type="text" name="name" placeholder="e.g. Insurance" class="mt-1 w-full p-2 border rounded" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Monthly Amount (£)</label>
                    <input type="number" step="0.01" name="amount" placeholder="50.00" class="mt-1 w-full p-2 border rounded" required>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-bold">
                    + Add Expense
                </button>
            </form>
        </div>
    </div>

    <script>
        // HANDLE PRODUCT SUBMIT
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('✅ Product Added!');
                    e.target.reset(); // Clear the form
                } else {
                    alert('❌ Error adding product');
                }
            } catch (err) {
                console.error(err);
                alert('❌ Error connecting to server');
            }
        });

        // HANDLE EXPENSE SUBMIT
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('✅ Expense Added!');
                    e.target.reset(); // Clear the form
                } else {
                    alert('❌ Error adding expense');
                }
            } catch (err) {
                console.error(err);
                alert('❌ Error connecting to server');
            }
        });
    </script>
</body>
</html>
