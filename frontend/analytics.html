<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales analytics - Quentl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-10 font-sans min-h-screen" data-nav="analytics">
    <div class="max-w-6xl mx-auto">
        <header class="site-header">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="/app/" class="site-brand-logoLink" aria-label="Quentl home">
                        <span class="site-logo-text">Quentl</span>
                    </a>
                </div>
            </div>
            <div class="site-header-actions">
            <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color scheme" title="Light / dark mode">
                <span class="theme-toggle__thumb" aria-hidden="true"></span>
            </button>
            </div>
        </header>
        <script src="site-nav.js"></script>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Sales analytics</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Revenue concentration and forecast trend vs break-even.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="surface-card p-6 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-4 border-b border-[var(--border-subtle)] pb-2">Best sellers (revenue)</h3>
                <div class="relative h-64">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>

            <div class="surface-card p-6 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-4 border-b border-[var(--border-subtle)] pb-2">Revenue trend</h3>
                <div class="relative h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let topProductsChartInstance = null;
        let trendChartInstance = null;

        function chartThemeColors() {
            const cs = getComputedStyle(document.documentElement);
            return {
                muted: cs.getPropertyValue('--chart-muted').trim(),
                grid: cs.getPropertyValue('--chart-grid').trim(),
                text: cs.getPropertyValue('--chart-text').trim()
            };
        }

        function buildChartDefaults() {
            const c = chartThemeColors();
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: c.text, font: { family: 'Inter, sans-serif', size: 11 } }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: c.muted, font: { family: 'Roboto Mono, monospace', size: 10 } },
                        grid: { color: c.grid }
                    },
                    y: {
                        ticks: { color: c.muted, font: { family: 'Roboto Mono, monospace', size: 10 } },
                        grid: { color: c.grid }
                    }
                }
            };
        }

        function destroyCharts() {
            if (topProductsChartInstance) {
                topProductsChartInstance.destroy();
                topProductsChartInstance = null;
            }
            if (trendChartInstance) {
                trendChartInstance.destroy();
                trendChartInstance = null;
            }
        }

        async function loadAnalytics() {
            destroyCharts();
            const prodRes = await fetch('/api/analytics/top-products/1');
            const topProducts = await prodRes.json();

            const trendRes = await fetch('/api/dashboard/1');
            const trendData = await trendRes.json();

            renderTopProductsChart(topProducts);
            renderTrendChart(trendData);
        }

        function renderTopProductsChart(data) {
            const ctx = document.getElementById('topProductsChart').getContext('2d');
            const chartDefaults = buildChartDefaults();
            const palette = ['#A14B14', '#2ECC71', '#818CF8', '#3B82F6', '#14B8A6'];
            topProductsChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'Total revenue (£)',
                        data: data.map(d => d.total_revenue),
                        backgroundColor: data.map((_, i) => palette[i % palette.length])
                    }]
                },
                options: {
                    ...chartDefaults,
                    plugins: {
                        ...chartDefaults.plugins,
                        legend: { display: false }
                    }
                }
            });
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const chartDefaults = buildChartDefaults();
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.forecast_month).toLocaleDateString('en-GB', { month: 'short' })),
                    datasets: [
                        {
                            label: 'Revenue',
                            data: data.map(d => d.revenue),
                            borderColor: '#2ECC71',
                            backgroundColor: 'rgba(46, 204, 113, 0.1)',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Break-even needed',
                            data: data.map(d => d.revenue_needed_to_break_even),
                            borderColor: '#E74C3C',
                            borderDash: [5, 5],
                            tension: 0.1,
                            fill: false
                        }
                    ]
                },
                options: chartDefaults
            });
        }

        loadAnalytics();
        window.addEventListener('themechange', function () {
            loadAnalytics();
        });
    </script>
</body>
</html>
