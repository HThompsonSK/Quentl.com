<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Jam Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 p-10">
    <div class="max-w-5xl mx-auto">
        
        <nav class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800">📊 Analytics Dashboard</h1>
            <a href="index.html" class="text-blue-600 hover:text-blue-800 font-medium">← Back to Overview</a>
        </nav>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold text-gray-700 mb-4">🏆 Best Sellers (Revenue)</h2>
                <div class="relative h-64">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold text-gray-700 mb-4">📈 Revenue Trend</h2>
                <div class="relative h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        async function loadAnalytics() {
            // 1. Fetch Top Products Data
            const prodRes = await fetch('/api/analytics/top-products/1');
            const topProducts = await prodRes.json();

            // 2. Fetch Trend Data (re-using the dashboard endpoint for now)
            const trendRes = await fetch('/api/dashboard/1');
            const trendData = await trendRes.json();

            renderTopProductsChart(topProducts);
            renderTrendChart(trendData);
        }

        function renderTopProductsChart(data) {
            const ctx = document.getElementById('topProductsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar', // Bar Chart
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'Total Revenue (£)',
                        data: data.map(d => d.total_revenue),
                        backgroundColor: ['#d946ef', '#a855f7', '#6366f1', '#3b82f6', '#14b8a6']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line', // Line Chart
                data: {
                    labels: data.map(d => new Date(d.forecast_month).toLocaleDateString('en-GB', {month:'short'})),
                    datasets: [
                        {
                            label: 'Revenue',
                            data: data.map(d => d.revenue),
                            borderColor: '#10b981', // Green
                            tension: 0.3
                        },
                        {
                            label: 'Break-Even Needed',
                            data: data.map(d => d.revenue_needed_to_break_even),
                            borderColor: '#ef4444', // Red
                            borderDash: [5, 5], // Dashed line
                            tension: 0.1
                        }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        loadAnalytics();
    </script>
</body>
</html>
