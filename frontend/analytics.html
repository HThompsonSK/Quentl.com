<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Marmalade</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-10 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-[var(--border-subtle)] pb-4 flex justify-between items-center flex-wrap gap-4">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="index.html" class="site-brand-logoLink" aria-label="Marmalade home">
                        <img src="assets/marmalade-logo.png" alt="Marmalade" class="site-logo" width="512" height="288" />
                    </a>
                    <p class="site-brand-tagline text-[var(--text-muted)] text-sm">Click any month to view details</p>
                </div>
            </div>
            <nav class="site-nav" aria-label="Main">
                <a href="index.html" class="site-nav-link">Dashboard</a>
                <a href="pipeline.html" class="site-nav-link">Pipeline</a>
                <a href="analytics.html" class="site-nav-link site-nav-link--active">Analytics</a>
                <a href="forecast.html" class="site-nav-link">Plan Sales</a>
                <a href="founder.html" class="site-nav-link">Founder Matrix</a>
                <a href="projects.html" class="site-nav-link">Project Builder</a>
                <a href="settings.html" class="site-nav-link">Settings</a>
            </nav>
        </header>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Analytics</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Revenue concentration and forecast trend vs break-even.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="surface-card p-6 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-4 border-b border-[var(--border-subtle)] pb-2">Best sellers (revenue)</h3>
                <div class="relative h-64">
                    <canvas id="topProductsChart"></canvas>
                </div>
            </div>

            <div class="surface-card p-6 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-4 border-b border-[var(--border-subtle)] pb-2">Revenue trend</h3>
                <div class="relative h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chartMuted = '#888888';
        const chartGrid = '#2A2A2A';
        const chartText = '#EDEDED';

        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: chartText, font: { family: 'Inter, sans-serif', size: 11 } }
                }
            },
            scales: {
                x: {
                    ticks: { color: chartMuted, font: { family: 'Roboto Mono, monospace', size: 10 } },
                    grid: { color: chartGrid }
                },
                y: {
                    ticks: { color: chartMuted, font: { family: 'Roboto Mono, monospace', size: 10 } },
                    grid: { color: chartGrid }
                }
            }
        };

        async function loadAnalytics() {
            const prodRes = await fetch('/api/analytics/top-products/1');
            const topProducts = await prodRes.json();

            const trendRes = await fetch('/api/dashboard/1');
            const trendData = await trendRes.json();

            renderTopProductsChart(topProducts);
            renderTrendChart(trendData);
        }

        function renderTopProductsChart(data) {
            const ctx = document.getElementById('topProductsChart').getContext('2d');
            const palette = ['#A14B14', '#2ECC71', '#818CF8', '#3B82F6', '#14B8A6'];
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'Total revenue (£)',
                        data: data.map(d => d.total_revenue),
                        backgroundColor: data.map((_, i) => palette[i % palette.length])
                    }]
                },
                options: {
                    ...chartDefaults,
                    plugins: {
                        ...chartDefaults.plugins,
                        legend: { display: false }
                    }
                }
            });
        }

        function renderTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => new Date(d.forecast_month).toLocaleDateString('en-GB', { month: 'short' })),
                    datasets: [
                        {
                            label: 'Revenue',
                            data: data.map(d => d.revenue),
                            borderColor: '#2ECC71',
                            backgroundColor: 'rgba(46, 204, 113, 0.1)',
                            tension: 0.3,
                            fill: false
                        },
                        {
                            label: 'Break-even needed',
                            data: data.map(d => d.revenue_needed_to_break_even),
                            borderColor: '#E74C3C',
                            borderDash: [5, 5],
                            tension: 0.1,
                            fill: false
                        }
                    ]
                },
                options: chartDefaults
            });
        }

        loadAnalytics();
    </script>
</body>
</html>
