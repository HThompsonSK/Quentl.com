<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Pipeline - Marmalade</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-[var(--border-subtle)] pb-4 flex justify-between items-center flex-wrap gap-4">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="index.html" class="site-brand-logoLink" aria-label="Marmalade home">
                        <img src="assets/marmalade-logo.png" alt="Marmalade" class="site-logo" width="512" height="288" />
                    </a>
                    <p class="site-brand-tagline text-[var(--text-muted)] text-sm">Click any month to view details</p>
                </div>
            </div>
            <nav class="site-nav" aria-label="Main">
                <a href="index.html" class="site-nav-link">Dashboard</a>
                <a href="pipeline.html" class="site-nav-link site-nav-link--active">Pipeline</a>
                <a href="analytics.html" class="site-nav-link">Analytics</a>
                <a href="forecast.html" class="site-nav-link">Plan Sales</a>
                <a href="founder.html" class="site-nav-link">Founder Matrix</a>
                <a href="projects.html" class="site-nav-link">Project Builder</a>
                <a href="settings.html" class="site-nav-link">Settings</a>
            </nav>
        </header>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Sales Pipeline</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Weighted opportunities and deal tracking.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="surface-card p-6 md:col-span-1 h-fit border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-6 border-b border-[var(--border-subtle)] pb-2">Add potential client</h3>
                <form id="leadForm" class="space-y-5">
                    <input type="hidden" name="company_id" value="1">

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Client name</label>
                        <input type="text" name="client_name" placeholder="e.g. Whole Foods" class="w-full font-mono" required>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Contract value (£)</label>
                        <input type="number" name="contract_value" placeholder="10000" class="w-full font-mono" required>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Probability of win (%)</label>
                        <input type="number" name="probability" placeholder="50" min="0" max="100" class="w-full font-mono" required>
                        <p class="text-[10px] font-mono text-[var(--text-muted)] mt-2 opacity-80">Realistic estimate (e.g. 50%)</p>
                    </div>

                    <button type="submit" class="btn-accent w-full">Add to pipeline</button>
                </form>
            </div>

            <div class="surface-card overflow-hidden md:col-span-2 border-t-2 border-t-[var(--border-subtle)]">
                <div class="px-6 py-5 border-b border-[var(--border-subtle)]">
                    <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest">Current opportunities</h3>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr>
                            <th>Client</th>
                            <th class="text-right">Value</th>
                            <th class="text-right">Prob.</th>
                            <th class="text-right">Weighted</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="leadsTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadLeads() {
            const res = await fetch('/api/leads/1');
            const leads = await res.json();
            const tbody = document.getElementById('leadsTableBody');
            tbody.innerHTML = '';

            leads.forEach(lead => {
                const weighted = lead.contract_value * (lead.probability / 100);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#222] transition';
                tr.innerHTML = `
                    <td class="font-medium text-[var(--text-primary)]">${lead.client_name}</td>
                    <td class="text-right font-mono text-[var(--text-primary)]">£${parseFloat(lead.contract_value).toLocaleString()}</td>
                    <td class="text-right font-mono text-[var(--text-muted)]">${lead.probability}%</td>
                    <td class="text-right font-mono font-medium text-[var(--runway-green)]">£${weighted.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</td>
                    <td class="text-center">
                        <button type="button" onclick="deleteLead(${lead.id})" class="btn-primary text-xs py-1 px-2 hover:border-[var(--death-red)] hover:text-[var(--death-red)]">Remove</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            await fetch('/api/leads', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            e.target.reset();
            loadLeads();
        });

        async function deleteLead(id) {
            if (confirm('Remove this lead?')) {
                await fetch(`/api/leads/${id}`, { method: 'DELETE' });
                loadLeads();
            }
        }

        loadLeads();
    </script>
</body>
</html>
