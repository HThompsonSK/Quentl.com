<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Sales - Marmalade</title>
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto">
        <header class="mb-8 border-b border-[var(--border-subtle)] pb-4 flex justify-between items-center flex-wrap gap-4">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="index.html" class="site-brand-logoLink" aria-label="Marmalade home">
                        <img src="assets/marmalade-logo.png" alt="Marmalade" class="site-logo" width="512" height="288" />
                    </a>
                    <p class="site-brand-tagline text-[var(--text-muted)] text-sm">Click any month to view details</p>
                </div>
            </div>
            <nav class="site-nav" aria-label="Main">
                <a href="index.html" class="site-nav-link">Dashboard</a>
                <a href="pipeline.html" class="site-nav-link">Pipeline</a>
                <a href="analytics.html" class="site-nav-link">Analytics</a>
                <a href="forecast.html" class="site-nav-link site-nav-link--active">Plan Sales</a>
                <a href="founder.html" class="site-nav-link">Founder Matrix</a>
                <a href="projects.html" class="site-nav-link">Project Builder</a>
                <a href="settings.html" class="site-nav-link">Settings</a>
            </nav>
        </header>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Plan Sales</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Set monthly unit forecasts by product.</p>
        </div>

        <div class="max-w-2xl">
            <div class="surface-card p-8 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-6 border-b border-[var(--border-subtle)] pb-2">Add monthly sales goal</h3>

                <form id="forecastForm" class="space-y-6">
                    <input type="hidden" name="company_id" value="1">

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Month</label>
                        <input type="date" name="month" class="w-full font-mono" required>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Product</label>
                        <select id="productSelect" name="product_id" class="w-full font-mono" required>
                            <option value="">Loading products...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Units to sell</label>
                        <input type="number" name="units" placeholder="e.g. 50" class="w-full font-mono" required>
                    </div>

                    <button type="submit" class="btn-accent w-full">Save forecast</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                const res = await fetch('/api/products?company_id=1');
                const products = await res.json();

                const select = document.getElementById('productSelect');
                select.innerHTML = '<option value="">— Select a product —</option>';

                products.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = `${p.name} (£${p.default_sales_price})`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Error loading products', err);
            }
        }

        document.getElementById('forecastForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const dateObj = new Date(data.month);
            data.month = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-01`;

            try {
                const res = await fetch('/api/forecast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Sales goal saved.');
                } else {
                    alert('Could not save forecast.');
                }
            } catch (err) {
                console.error(err);
                alert('Server error');
            }
        });

        loadProducts();
    </script>
</body>
</html>
