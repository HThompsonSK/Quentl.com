<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit forecasts - Marmalade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <script src="theme.js"></script>
</head>
<body class="p-10 font-sans min-h-screen" data-nav="sales">
    <div class="max-w-6xl mx-auto">
        <header class="site-header">
            <div class="shrink-0">
                <div class="site-brand">
                    <a href="index.html" class="site-brand-logoLink" aria-label="Marmalade home">
                        <span class="site-logo-text">Marmalade</span>
                    </a>
                </div>
            </div>
            <div class="site-header-actions">
            <nav id="site-nav" class="site-nav" aria-label="Main"></nav>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color scheme" title="Light / dark mode">
                <span class="theme-toggle__thumb" aria-hidden="true"></span>
            </button>
            </div>
        </header>
        <script src="site-nav.js"></script>

        <div class="mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-[var(--text-primary)]">Unit forecasts</h2>
            <p class="text-[var(--text-muted)] text-sm mt-1">Set monthly unit forecasts by product. <a href="sales-planner.html" class="text-[var(--accent-orange)] hover:underline font-medium">← Back to Sales planner</a></p>
        </div>

        <div class="max-w-2xl">
            <div class="surface-card p-8 border-t-2 border-t-[var(--accent-orange)]">
                <h3 class="text-xs font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-6 border-b border-[var(--border-subtle)] pb-2">Add monthly sales goal</h3>

                <form id="forecastForm" class="space-y-6">
                    <input type="hidden" name="company_id" value="1">

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Month</label>
                        <input type="date" name="month" class="w-full font-mono" required>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Product</label>
                        <select id="productSelect" name="product_id" class="w-full font-mono" required>
                            <option value="">Loading products...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-semibold text-[var(--text-muted)] uppercase tracking-widest mb-2">Units to sell</label>
                        <input type="number" name="units" placeholder="e.g. 50" class="w-full font-mono" required>
                    </div>

                    <button type="submit" class="btn-accent w-full">Save forecast</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function loadProducts() {
            try {
                const res = await fetch('/api/products?company_id=1');
                const products = await res.json();

                const select = document.getElementById('productSelect');
                select.innerHTML = '<option value="">— Select a product —</option>';

                products.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = `${p.name} (£${p.default_sales_price})`;
                    select.appendChild(option);
                });
            } catch (err) {
                console.error('Error loading products', err);
            }
        }

        document.getElementById('forecastForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const dateObj = new Date(data.month);
            data.month = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-01`;

            try {
                const res = await fetch('/api/forecast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    alert('Sales goal saved.');
                } else {
                    alert('Could not save forecast.');
                }
            } catch (err) {
                console.error(err);
                alert('Server error');
            }
        });

        loadProducts();
    </script>
</body>
</html>
